<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0d">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23d8b475'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%231a1508'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    try {
      var th = JSON.parse(localStorage.getItem("nzm.theme") || '"dark"');
      var lg = JSON.parse(localStorage.getItem("nzm.lang") || '"ar"');
      document.documentElement.setAttribute("data-theme", th === "light" ? "light" : "dark");
      document.documentElement.setAttribute("lang", lg === "en" ? "en" : "ar");
      document.documentElement.setAttribute("dir", lg === "en" ? "ltr" : "rtl");
    } catch (e) {}
  </script>
  <title>الصفحة غير موجودة · 404</title>
</head>
<!-- Standalone on purpose: a 404 must render even if data.js or site.js fail to load. -->
<body style="background:var(--bg);color:var(--ink);font-family:var(--font);min-height:100vh;display:grid;place-items:center;padding:2rem;text-align:center">
  <div style="max-width:34rem;display:grid;gap:1rem;justify-items:center">
    <div style="font-size:3.5rem;font-weight:800;color:var(--accent);line-height:1">404</div>
    <h1 style="font-size:1.35rem;font-weight:700">هذه الصفحة غير موجودة</h1>
    <p style="color:var(--ink-soft)">This page doesn’t exist — it may have moved or the link is wrong.</p>
    <a href="/" style="margin-top:.5rem;padding:.75rem 1.5rem;border-radius:var(--r-md);background:var(--accent);color:var(--accent-ink);font-weight:700">
      العودة للرئيسية · Back home
    </a>
    <a href="/store.html" style="color:var(--ink-soft);text-decoration:underline">المتجر · Store</a>
  </div>
</body>
</html>
