.1" stroke="#6b6b73" stroke-opacity=".55"/><text x="338" y="70" fill="#6b6b73" font-size="16" font-weight="700">Step 1️⃣ The inbox</text><text x="338" y="92" fill="#a7a39b" font-size="11.5">Everything arrives on WhatsApp. Most of it needs minutes,</text><text x="338" y="109" fill="#a7a39b" font-size="11.5">not hours.</text><rect x="890" y="40" width="480" height="340" rx="14" fill="#6b6b73" fill-opacity="0.1" stroke="#6b6b73" stroke-opacity=".55"/><text x="908" y="70" fill="#6b6b73" font-size="16" font-weight="700">Step 2️⃣ The build</text><text x="908" y="92" fill="#a7a39b" font-size="11.5">The part that is genuinely your job — and the part that will</text><text x="908" y="109" fill="#a7a39b" font-size="11.5">eventually break.</text><rect x="360" y="150" width="400" height="190" rx="14" fill="#2f8a63" fill-opacity="0.16" stroke="#2f8a63" stroke-opacity=".55"/><text x="378" y="180" fill="#2f8a63" font-size="13" font-weight="700">📥 What arrives</text><rect x="930" y="150" width="400" height="190" rx="14" fill="#c05a55" fill-opacity="0.16" stroke="#c05a55" stroke-opacity=".55"/><text x="948" y="180" fill="#c05a55" font-size="13" font-weight="700">🛠️ Hand work</text><rect x="2160" y="40" width="360" height="280" rx="14" fill="#6b6b73" fill-opacity="0.16" stroke="#6b6b73" stroke-opacity=".55"/><text x="2178" y="70" fill="#6b6b73" font-size="13" font-weight="700">📈 When to stop doing this by hand</text><text x="2178" y="92" fill="#a7a39b" font-size="11.5">O3 is the ceiling. Ten merchants is a good</text><text x="2178" y="109" fill="#a7a39b" font-size="11.5">week. Fifty is not a person&#x27;s job. When O3</text><text x="2178" y="126" fill="#a7a39b" font-size="11.5">stops fitting in your week, self-serve</text><text x="2178" y="143" fill="#a7a39b" font-size="11.5">product editing pays for itself — that,</text><text x="2178" y="160" fill="#a7a39b" font-size="11.5">not features or design, is the moment to</text><text x="2178" y="177" fill="#a7a39b" font-size="11.5">build the real backend.</text><rect x="40" y="40" width="300" height="300" rx="14" fill="#6b6b73" fill-opacity="0.16" stroke="#6b6b73" stroke-opacity=".55"/><text x="58" y="70" fill="#6b6b73" font-size="13" font-weight="700">⚠️ Map, not automation</text><text x="58" y="92" fill="#a7a39b" font-size="11.5">Every node here is a No-Op: it does</text><text x="58" y="109" fill="#a7a39b" font-size="11.5">nothing, sends nothing, charges nobody. It</text><text x="58" y="126" fill="#a7a39b" font-size="11.5">exists so the business can be read on a</text><text x="58" y="143" fill="#a7a39b" font-size="11.5">canvas. Press Execute Workflow to walk the</text><text x="58" y="160" fill="#a7a39b" font-size="11.5">path. Never set this Active. The workflows</text><text x="58" y="177" fill="#a7a39b" font-size="11.5">that actually run are the numbered ones i…</text><rect x="1460" y="40" width="260" height="570" rx="14" fill="#6b6b73" fill-opacity="0.1" stroke="#6b6b73" stroke-opacity=".55"/><text x="1478" y="70" fill="#6b6b73" font-size="16" font-weight="700">Step 3️⃣ Growing it</text><text x="1478" y="92" fill="#a7a39b" font-size="11.5">The promises you made on the merchant page</text><text x="1478" y="109" fill="#a7a39b" font-size="11.5">come due here.</text><rect x="1810" y="40" width="260" height="340" rx="14" fill="#6b6b73" fill-opacity="0.1" stroke="#6b6b73" stroke-opacity=".55"/><text x="1828" y="70" fill="#6b6b73" font-size="16" font-weight="700">Step 4️⃣ What you never touch</text><text x="1828" y="92" fill="#a7a39b" font-size="11.5">Already automated. Do not spend your week</text><text x="1828" y="109" fill="#a7a39b" font-size="11.5">here.</text><rect x="1500" y="150" width="180" height="190" rx="14" fill="#8367b8" fill-opacity="0.16" stroke="#8367b8" stroke-opacity=".55"/><text x="1518" y="180" fill="#8367b8" font-size="13" font-weight="700">📣 Marketing</text><rect x="1500" y="380" width="180" height="190" rx="14" fill="#3d78c0" fill-opacity="0.16" stroke="#3d78c0" stroke-opacity=".55"/
