name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lifecycle-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Greet and check via composite action
        id: greet
        uses: ./.github/actions/greet-and-check
        with:
          who: 'first-pr-practice'

      - name: Use the composite's output
        run: |
          echo "composite returned: ${{ steps.greet.outputs.greeting }}"

      - name: Run the docker demo action
        uses: ./.github/actions/docker-demo
        with:
          greeting: 'hello'

  # Separate job so it runs in parallel with lifecycle-demo and a red check
  # points straight at the TypeScript rather than the Actions demo.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci installs exactly what package-lock.json pins and fails if the
      # lockfile is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
