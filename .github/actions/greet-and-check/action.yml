name: 'Greet and Check'
description: 'Composite action that runs the lifecycle-demo JS action and asserts its greeting output'
inputs:
  who:
    description: 'Who to greet'
    required: false
    default: 'world'
outputs:
  greeting:
    description: 'The greeting produced by lifecycle-demo'
    value: ${{ steps.demo.outputs.greeting }}
runs:
  using: 'composite'
  steps:
    # Nested local reference: resolved against the checked-out workspace,
    # so the caller must have run actions/checkout first. Composite actions
    # have no pre/post support — inputs are wired explicitly, not INPUT_* vars.
    - name: Run the lifecycle demo action
      id: demo
      uses: ./.github/actions/lifecycle-demo
      with:
        who: ${{ inputs.who }}

    # Values flow in via env: so they arrive as data, never spliced into the
    # script text — the hardening GitHub's docs recommend against expression
    # injection (a fork-controlled value inside ${{ }} in run: is code execution).
    - name: Assert the greeting
      shell: bash
      env:
        ACTUAL: ${{ steps.demo.outputs.greeting }}
        WHO: ${{ inputs.who }}
      run: |
        expected="hello, ${WHO}!"
        echo "composite: actual=$ACTUAL expected=$expected"
        test "$ACTUAL" = "$expected"
